[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cbt-companion"
version = "0.1.0"
description = "Dataset engineering pipeline for fine-tuning Gemma 4 E2B using Unsloth."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "CBT Companion Team" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=3.0,<5.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "transformers>=4.40.0",
    "jinja2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Lets the suite run straight from a clone, without an editable install.
pythonpath = ["src", "."]
